{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to School Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            margin: 10px;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            transition: transform 0.3s ease;
        }
        .btn-custom:hover {
            transform: scale(1.1);
        }
        .inactive{
            display:none;
            height:0px;
            width:0px;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1>Welcome to Our School Management System</h1>
        <p class="lead">Please choose your role to continue:</p>
        <div id="unauth">
            <a href="{% url "login_teacher" %}" class="btn btn-light btn-custom">Teacher</a>
            <a href="{% url "student_login" %}" class="btn btn-light btn-custom">Student</a>
        </div>
        <div id="authed" class='inactive'>
            <a href="{% url "teacher_home" %}" class="btn btn-light btn-custom">Let's Go...</a>
        </div>
    </div>

    <script src="{% static "scripts/welcomescript.js" %}"></script> 
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
