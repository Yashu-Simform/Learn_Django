{% extends "student/base.html" %}
{% load custom_filters %}
{% block addon %}
<style>
    .teacher-home-custom {
        padding: 20px;
        background-color: #f8f9fa;
    }
    
    .teacher-dashboard-header-custom {
        margin-bottom: 30px;
    }
    
    .teacher-dashboard-header-custom h1 {
        font-size: 2rem;
        font-weight: 600;
        color: #333;
    }
    
    .teacher-dashboard-cards-custom {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
        overflow-y: scroll;
    }
    
    .teacher-card-custom {
        min-height: 20rem;
        max-height: 70%;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .teacher-card-custom:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }
    
    .teacher-card-custom h2 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: #007bff;
    }
    
    .teacher-dropdown-custom {
        margin-bottom: 20px;
        max-height: 70%;
    }
    
    .teacher-dropdown-custom .btn {
        width: 100%;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .teacher-dropdown-menu-custom {
        width: 100%;
        min-height: 10rem;
        max-height: 70%;
        overflow-y: scroll;
    }
    
    .teacher-table-custom {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    
    .teacher-table-custom th,
    .teacher-table-custom td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }
    
    .teacher-table-custom th {
        background-color: #007bff;
        color: white;
        font-weight: 600;
    }
    
    .teacher-table-custom tr:hover {
        background-color: #f1f1f1;
    }
    
    .teacher-quick-actions-custom {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    
    .teacher-quick-actions-custom .btn {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }
    
    .teacher-quick-actions-custom .btn-primary {
        background-color: #007bff;
        border: none;
    }
    
    .teacher-quick-actions-custom .btn-primary:hover {
        background-color: #0056b3;
    }
    
    .teacher-quick-actions-custom .btn-success {
        background-color: #28a745;
        border: none;
    }
    
    .teacher-quick-actions-custom .btn-success:hover {
        background-color: #218838;
    }
    
    @media (max-width: 768px) {
        .teacher-dashboard-cards-custom {
            grid-template-columns: 1fr;
        }
    
        .teacher-quick-actions-custom {
            flex-direction: column;
        }
    }
</style>

<div class="card teacher-card-custom">
    <h2>Courses</h2>
    <div class="dropdown teacher-dropdown-custom">
        <button class="btn btn-primary dropdown-toggle" type="button" id="courseDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            Select Class
        </button>
        <ul class="dropdown-menu teacher-dropdown-menu-custom" aria-labelledby="courseDropdown">
            {% for class in 12|get_range %}
            <li><a class="dropdown-item" href="{% url "fetchCourses" forloop.counter %}">{{ forloop.counter }}</a></li>
            {% endfor %}
        </ul>
    </div>
    <div class="courses">
        <table class="teacher-table-custom">
            <thead>
                <tr>
                    <th>Courses</th>
                </tr>
            </thead>
            <tbody>
                {% for c in courses %}
                <tr>
                    <td>{{ c.course_name }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock addon %}
